[project]
name = "fund"
revision = "1.0"

[profiles.production]
AWS_S3_ARCHIVE_BUCKET_NAME = { description = "Shared market-data archive bucket; production writes, every profile reads", required = false, default = "oscm-fund-archive" }
AWS_S3_RECORDS_BUCKET_NAME = { description = "This profile's journal and log bucket", required = false, default = "oscm-fund-production" }
MASSIVE_BASE_URL = { description = "Massive API base URL", required = true }
MASSIVE_API_KEY = { description = "Massive API key for data", required = true }
DATABENTO_API_KEY = { description = "Databento API key for historical and live market data", required = false }
ALPACA_API_KEY_ID = { description = "Alpaca API key for trading and data", required = true }
ALPACA_API_SECRET = { description = "Alpaca API secret for trading and data", required = true }
ALPACA_IS_PAPER = { description = "Alpaca paper trading flag", required = false, default = "false" }
SEC_EDGAR_CONTACT_EMAIL = { description = "Contact SEC requires in the EDGAR User-Agent", required = false }

[profiles."development/john.forstmeier"]
AWS_S3_ARCHIVE_BUCKET_NAME = { description = "Shared market-data archive bucket; production writes, every profile reads", required = false, default = "oscm-fund-archive" }
AWS_S3_RECORDS_BUCKET_NAME = { description = "This profile's journal and log bucket", required = false, default = "oscm-fund-development-john-forstmeier" }
MASSIVE_BASE_URL = { description = "Massive API base URL", required = true }
MASSIVE_API_KEY = { description = "Massive API key for data", required = true }
DATABENTO_API_KEY = { description = "Databento API key for historical and live market data", required = false }
ALPACA_API_KEY_ID = { description = "Alpaca API key for trading and data", required = true }
ALPACA_API_SECRET = { description = "Alpaca API secret for trading and data", required = true }
ALPACA_IS_PAPER = { description = "Alpaca paper trading flag", required = false, default = "true" }
SEC_EDGAR_CONTACT_EMAIL = { description = "Contact SEC requires in the EDGAR User-Agent", required = false }
MASSIVE_S3_ENDPOINT = { description = "Massive flat-file S3 endpoint; the Stocks Advanced keys lapse 2026-10-26", required = false }
MASSIVE_S3_ACCESS_KEY_ID = { description = "Massive flat-file access key ID", required = false }
MASSIVE_S3_SECRET_ACCESS_KEY = { description = "Massive flat-file secret access key", required = false }
FUND_UNIVERSE = { description = "Symbols the trader trades, comma-separated; the trader refuses to start without it", required = false }
FUND_NOISE_SHARES = { description = "Whole shares the noise strategy holds of each symbol it draws; required by the trader", required = false }
FUND_NOISE_SEED = { description = "The noise strategy's seed; required by the trader", required = false }
FUND_GROSS_LIMIT = { description = "Dollars the trader may hold across every name; required by the trader", required = false }
FUND_PER_NAME_LIMIT = { description = "Dollars the trader may hold in one name; required by the trader", required = false }
FUND_DAILY_LOSS_LIMIT = { description = "Dollars the trader may lose in a session before going flat; required by the trader", required = false }
FUND_FLAT_BEFORE_CLOSE_MINUTES = { description = "Minutes before the close from which the trader holds nothing; required by the trader", required = false }

