[project]
name = "fund"
revision = "1.0"

[profiles.production]
AWS_S3_ARCHIVE_BUCKET_NAME = { description = "Shared market-data archive bucket; production writes, every profile reads", required = false, default = "oscm-fund-archive" }
AWS_S3_PROFILE_BUCKET_NAME = { description = "This profile's bucket: journals, logs, configuration and scratch", required = false, default = "oscm-fund-production" }
MASSIVE_BASE_URL = { description = "Massive API base URL", required = true }
MASSIVE_API_KEY = { description = "Massive API key for data", required = true }
ALPACA_API_KEY_ID = { description = "Alpaca API key for trading and data", required = true }
ALPACA_API_SECRET = { description = "Alpaca API secret for trading and data", required = true }
ALPACA_IS_PAPER = { description = "Alpaca paper trading flag", required = false, default = "false" }

[profiles."development/john.forstmeier"]
AWS_S3_ARCHIVE_BUCKET_NAME = { description = "Shared market-data archive bucket; production writes, every profile reads", required = false, default = "oscm-fund-archive" }
AWS_S3_PROFILE_BUCKET_NAME = { description = "This profile's bucket: journals, logs, configuration and scratch", required = false, default = "oscm-fund-development-john-forstmeier" }
