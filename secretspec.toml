ALPACA_API_SECRET = { description = "Alpaca API secret for trading and data", required = true }
ALPACA_IS_PAPER = { description = "Alpaca paper trading flag", required = false, default = "true" }
FUND_UNIVERSE = { description = "Symbols the trader trades, comma-separated; the trader refuses to start without it", required = false }
FUND_GROSS_LIMIT = { description = "Dollars the trader may hold across every name; required by the trader", required = false }
FUND_PER_NAME_LIMIT = { description = "Dollars the trader may hold in one name; required by the trader", required = false }
FUND_DAILY_LOSS_LIMIT = { description = "Dollars the trader may lose in a session before going flat; required by the trader", required = false }
FUND_FLAT_BEFORE_CLOSE_MINUTES = { description = "Minutes before the close from which the trader holds nothing; required by the trader", required = false }

