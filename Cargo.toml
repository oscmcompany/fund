[package]
name = "fund"
version = "0.0.1"
edition = "2021"
resolver = "2"
# The old tree at `src/` stays on disk until the final rebuild commit, and Cargo would otherwise
# auto-discover `src/bin/*.rs` as binary targets and try to compile them against the new library.
# Binaries are declared explicitly as they are rebuilt.
autobins = false

# Rebuild in progress. The library points at `src_new/`, which is built bottom-up across three
# pull requests; the old tree remains on disk at `src/` and is not compiled. Binary targets return
# with the modules they depend on -- the service and trainer in the second, the dashboard in the
# third -- and `src_new` is renamed to `src` in the final commit.
# See `.scratchpad/rebuild_0_target_design.md`.
[lib]
name = "fund"
path = "src_new/lib.rs"

# No features. `dashboard` returns with the dashboard binary in the third pull request; there is
# deliberately no `train` feature, because it existed so an inference-only build could skip the
# training modules but burn's `autodiff` is always compiled in anyway (it costs the NdArray
# inference path nothing), so all the flag excluded was `rand`. One build configuration is worth
# more than one unlinked random number generator.

[dependencies]
# Shared / base (always compiled)
chrono = { version = "0.4.44", features = ["serde"] }
polars = { version = "0.51.0", features = [
  "lazy",
  "parquet",
  "strings",
  "is_in",
  "semi_anti_join",
] }
reqwest = { version = "0.13", features = ["query", "json", "native-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono",
  "uuid",
  "macros",
  "rust_decimal",
  "json",
] }
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "json",
] }
tracing-appender = "0.2"
aws-config = "1.8.15"
aws-sdk-s3 = "1.129"
thiserror = "2.0.3"
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Direct dependency solely to select a process-wide Rustls `CryptoProvider` at
# startup. Rustls 0.23 is pulled transitively (sqlx, aws-sdk) with both the
# `aws-lc-rs` and `ring` providers enabled, so it cannot choose one
# automatically and panics on first TLS use. See `common::crypto`.
rustls = { version = "0.23", features = ["aws_lc_rs"] }

# Eastern-time arithmetic. Every cron gate, session boundary, and trading-date rollover in the
# system is expressed in America/New_York, so this is unconditional rather than feature-gated.
chrono-tz = "0.10"

# Model. `autodiff` brings the Autodiff backend used by Rust-native training; it adds no runtime
# cost to the NdArray inference path, so it is always compiled in rather than gated behind `train`.
# flate2/tar/tempfile unpack the `model.tar.gz` artifact that both training and inference handle.
burn = { version = "0.16", features = ["ndarray", "autodiff"] }
ndarray = "0.16"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.27"

# Epoch shuffling during training.
rand = "0.10"

[dev-dependencies]
aws-credential-types = "1.2.14"
http = "1"
mockito = "1.7"
serial_test = "4.0"
tower = { version = "0.5", features = ["util"] }
