[package]
name = "fund"
version = "0.0.1"
edition = "2024"

# The legacy crate keeps its own manifest and lockfile and is never built from here.
[workspace]
exclude = ["src_old"]

[dependencies]
# No `clock` feature, so pure code cannot read the wall clock.
chrono = { version = "0.4.44", default-features = false, features = [
  "serde",
  "std",
] }
chrono-tz = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "http2",
  "query",
  "gzip",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
# Walks macro bodies for the purity check, which syn leaves unparsed.
proc-macro2 = "1"
# Parses `src/common/` for the purity check.
syn = { version = "2", default-features = false, features = [
  "full",
  "parsing",
  "visit",
] }
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt"] }
