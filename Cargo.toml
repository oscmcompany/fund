[package]
name = "fund"
version = "0.0.1"
edition = "2021"
resolver = "2"

# No features, and four binaries auto-discovered from `src/bin/`: `fund`, `tide_model_trainer`,
# `seed_equity_bars`, `seed_equity_details`.
#
# There is deliberately no `train` feature -- it existed so an inference-only build could skip the
# training modules, but burn's `autodiff` is always compiled in anyway (it costs the NdArray
# inference path nothing), so all the flag excluded was `rand`. There is deliberately no `dashboard`
# feature either, for a sharper reason: features are crate-wide, so building the service and then
# the dashboard with different feature sets recompiles the entire dependency graph twice on every
# `devenv up`. Axum is cheaper than that. One build configuration is worth more than one unlinked
# web framework.

[dependencies]
# Shared / base (always compiled)
chrono = { version = "0.4.44", features = ["serde"] }
polars = { version = "0.51.0", features = [
  "lazy",
  "parquet",
  "strings",
  "is_in",
  "semi_anti_join",
] }
reqwest = { version = "0.13", features = ["query", "json", "native-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono",
  "uuid",
  "macros",
  "rust_decimal",
  "json",
] }
tokio = { version = "1.51.1", features = ["full"] }
# `CancellationToken`, for the shutdown signal shared between the listener and the recovery scan.
tokio-util = "0.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "json",
] }
tracing-appender = "0.2"
aws-config = "1.8.15"
aws-sdk-s3 = "1.129"
thiserror = "2.0.3"
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Direct dependency solely to select a process-wide Rustls `CryptoProvider` at
# startup. Rustls 0.23 is pulled transitively (sqlx, aws-sdk) with both the
# `aws-lc-rs` and `ring` providers enabled, so it cannot choose one
# automatically and panics on first TLS use. See `common::crypto`.
rustls = { version = "0.23", features = ["aws_lc_rs"] }

# Eastern-time arithmetic. Every cron gate, session boundary, and trading-date rollover in the
# system is expressed in America/New_York, so this is unconditional rather than feature-gated.
chrono-tz = "0.10"

# Model. `autodiff` brings the Autodiff backend used by Rust-native training; it adds no runtime
# cost to the NdArray inference path, so it is always compiled in rather than gated behind `train`.
# flate2/tar/tempfile unpack the `model.tar.gz` artifact that both training and inference handle.
burn = { version = "0.16", features = ["ndarray", "autodiff"] }
ndarray = "0.16"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.27"

# Epoch shuffling during training.
rand = "0.10"

# The dashboard's HTTP server. Unconditional rather than behind a feature -- see the note above.
axum = "0.8"

[dev-dependencies]
aws-credential-types = "1.2.14"
# `test-util` supplies the scripted HTTP client that lets `data::archive` be tested at all: the
# module is almost entirely S3 round trips and every other test in it is a pure-function test.
# This crate rather than `aws-smithy-runtime`, whose re-export is the `http` 0.x variant.
aws-smithy-http-client = { version = "1.2", features = ["test-util"] }
aws-smithy-types = "1.6"
http = "1"
# A real decoder rather than undoing `%3D` by hand: RFC 3986 allows either hex case, so a scripted
# request that stops matching would make the test pass while injecting nothing.
percent-encoding = "2.3"
mockito = "1.7"
serial_test = "4.0"
tower = { version = "0.5", features = ["util"] }
