[package]
name = "fund"
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace]
members = ["studies"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
match_wildcard_for_single_variants = "deny"
wildcard_enum_match_arm = "deny"

[lints]
workspace = true

[dependencies]
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.150.0", default-features = false, features = [
  "sigv4a",
  "http-1x",
  "default-https-client",
  "rt-tokio",
] }
bytes = "1.12.1"
# No `clock` feature, so pure code cannot read the wall clock.
chrono = { version = "0.4.44", default-features = false, features = [
  "serde",
  "std",
] }
chrono-tz = "0.10"
# Gzips the raw response pages the archive keeps as served, and reads them back.
flate2 = "1.1"
parquet = { version = "60.0.0", default-features = false, features = [
  "arrow",
  "snap",
] }
# Draws the synthetic market; no `sys_rng` or `thread_rng`, so every generator is seeded by its caller.
rand = { version = "0.10.3", default-features = false, features = [
  "std",
  "std_rng",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "http2",
  "query",
  "gzip",
] }
serde = { version = "1.0.229", features = ["derive"] }
# Exact float parsing, so a journaled reading reads back as the value written.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
toml = { version = "1.1.7", default-features = false, features = [
  "parse",
  "serde",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
# Walks macro bodies for the purity check, which syn leaves unparsed.
proc-macro2 = "1"
# Parses `src/common/` for the purity check.
syn = { version = "3", default-features = false, features = [
  "full",
  "parsing",
  "visit",
] }
tokio = { version = "1.53.1", features = ["test-util", "rt"] }

# Integer overflow panics in release and the `study` profile that inherits it, as it does in debug, rather than wrapping.
[profile.release]
overflow-checks = true

# Studies iterate on code that changes every build, so our crates compile fast while dependencies stay optimized.
[profile.study]
inherits = "release"
opt-level = 1
incremental = true
codegen-units = 256

[profile.study.package."*"]
opt-level = 3
