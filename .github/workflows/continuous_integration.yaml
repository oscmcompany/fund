---
name: Continuous integration
run-name: Continuous integration
on:
  pull_request:
  # Only run on master pushes to provide a base-branch cache for pull requests.
  push:
    branches:
      - master
permissions:
  contents: read
  pull-requests: read
jobs:
  ci:
    name: Continuous integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Ungated, since a private file can be of any type; plain git, so it
      # needs no devenv shell.
      - name: Check no private file is tracked
        run: ./checks/private-files
      # Ungated too, since the SQL it reads sits in .sql, Rust and shell files.
      - name: Check every derived date has a pinned time zone
        run: ./checks/timezones
      - name: Detect changed file types
        uses: dorny/paths-filter@v3
        id: changes
        with:
          # The toolchain file and devenv define what both halves share, so they
          # trigger both.
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'studies/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'deny.toml'
              - 'secretspec.toml'
              - 'views.sql'
              - 'checks/**'
              - 'rust-toolchain.toml'
              - 'devenv.nix'
              - 'devenv.yaml'
              - 'devenv.lock'
            base:
              - '**/*.nix'
              - '**/*.md'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.toml'
              - 'devenv.lock'
      # Deliberately no disk-freeing step. Removing dotnet, ghc and boost
      # cost 35-70s of every run; measured on run 32382969223 the runner starts
      # with 87G free and the removal recovers 11G nothing asks for.
      #
      # Deliberately no Nix binary cache action here. devenv pins nixpkgs to
      # `cachix/devenv-nixpkgs/rolling` and configures `devenv.cachix.org` as a
      # substituter, so that cache and `cache.nixos.org` already serve the whole
      # shell closure. Caching Nix into the GitHub Actions cache on top of that
      # uploaded every substituted path one at a time, costing many minutes in
      # the post-job step while duplicating what the two public caches provide.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.1
      - name: Check Nix matches the pinned release
        run: |
          source host/versions
          nix --version | grep -F "Determinate Nix ${NIX_VERSION})" || { echo "CI Nix is not ${NIX_VERSION}"; exit 1; }
      - name: Install devenv
        run: |
          source host/versions
          nix profile install --accept-flake-config "github:cachix/devenv/v${DEVENV_VERSION}"
      - name: Cache Rust dependencies
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: rust-continuous-integration
          save-if: true
          add-rust-environment-hash-key: false
      # Deliberately no llvm-cov cache. It restored target/llvm-cov-target at a
      # cost of 117-180s on every Rust pull request and bought nothing: measured
      # across runs 32381409920 and 32383074109, the Rust checks took 370s with
      # it and 369s without. Swatinem/rust-cache above already covers ~/.cargo
      # and target/, which is why the second cache was redundant.

      # Gated because it lints nix, markdown, yaml, toml and none of those
      # are in most pull requests here: nineteen of the last twenty-five merged
      # were Rust-only, and each paid two and a half minutes to lint files they
      # did not touch. `Cargo.toml` matches both filters, so a dependency bump
      # still gets its toml linted.
      - name: Run base checks
        if: steps.changes.outputs.base == 'true'
        run: devenv --secretspec-provider env --secretspec-profile development tasks run checks:base
      - name: Run Rust checks
        if: steps.changes.outputs.rust == 'true'
        env:
          CARGO_INCREMENTAL: "0"
        run: devenv --secretspec-provider env --secretspec-profile development tasks run checks:rust
      # CI only, so no laptop or host carries the tool; it fetches the RustSec
      # database, so a new advisory fails the next Rust pull request by design.
      # Last, so a fresh advisory never hides the build and test results.
      - name: Check dependency advisories, licences and sources
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' }}
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo deny --workspace check
