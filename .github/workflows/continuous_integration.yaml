---
name: Continuous integration
run-name: Continuous integration
on:
  pull_request:
  # Only run on master pushes to provide a base-branch cache for pull requests.
  push:
    branches:
      - master
permissions:
  contents: read
  pull-requests: read
jobs:
  ci:
    name: Continuous integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Detect changed file types
        uses: dorny/paths-filter@v3
        id: changes
        with:
          # `.sqlx/` is Rust's: the build runs with SQLX_OFFLINE, so a wrong cache
          # fails compilation and nothing else would catch it. devenv defines the
          # toolchain both halves run under, so it triggers both rather than
          # picking one.
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.sqlx/**'
              - 'devenv.nix'
              - 'devenv.lock'
            base:
              - '**/*.nix'
              - '**/*.md'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.toml'
              - '**/*.sql'
              - '.sqlfluff'
              - '.sqlfluffignore'
              - 'devenv.lock'
      # Reports the headroom either side, because nothing here records whether the
      # removal is still load-bearing. It costs 35-70s of every run, and if the
      # runner turns out to have room to spare the step can go rather than be
      # optimized.
      - name: Free disk space
        run: |
          echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') available on /"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') available on /"
      # Deliberately no Nix binary cache action here. devenv pins nixpkgs to
      # `cachix/devenv-nixpkgs/rolling` and configures `devenv.cachix.org` as a
      # substituter, so that cache and `cache.nixos.org` already serve the whole
      # shell closure. Caching Nix into the GitHub Actions cache on top of that
      # uploaded every substituted path one at a time, costing many minutes in
      # the post-job step while duplicating what the two public caches provide.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Cache Rust dependencies
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: rust-continuous-integration
          save-if: true
          add-rust-environment-hash-key: false
      - name: Cache llvm-cov artifacts
        if: steps.changes.outputs.rust == 'true'
        uses: actions/cache@v4
        with:
          path: target/llvm-cov-target
          key: llvm-cov-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            llvm-cov-${{ runner.os }}-
      # Gated because it lints nix, markdown, yaml, toml and sql and none of those
      # are in most pull requests here: nineteen of the last twenty-five merged
      # were Rust-only, and each paid two and a half minutes to lint files they
      # did not touch. `Cargo.toml` matches both filters, so a dependency bump
      # still gets its toml linted.
      - name: Run base checks
        if: steps.changes.outputs.base == 'true'
        run: devenv --secretspec-provider env --secretspec-profile development tasks run checks:base
      # The integration test targets need a database and an S3-compatible
      # object store. Only those two are started, not the fund services: those
      # would connect to Alpaca and are not what is under test here.
      - name: Start test services
        if: steps.changes.outputs.rust == 'true'
        run: >-
          devenv --secretspec-provider env --secretspec-profile development
          --profile test up postgres object-store --detach
      - name: Wait for test services
        if: steps.changes.outputs.rust == 'true'
        run: |
          # Any HTTP response means the object store is listening. `curl -f`
          # would treat a 403 as down, and an unsigned GET / returns 403 on
          # MinIO and on real S3, so the probe must not assume a 200 there.
          object_store_up() {
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8333 || true)
            [ -n "${status}" ] && [ "${status}" != "000" ]
          }
          for attempt in $(seq 1 90); do
            postgres_ready=false
            object_store_ready=false
            pg_isready -h localhost -p 5432 -q && postgres_ready=true
            object_store_up && object_store_ready=true
            if [ "$postgres_ready" = true ] && [ "$object_store_ready" = true ]; then
              echo "Test services ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "Test services not ready within 90s"
          echo "  postgres:     $postgres_ready"
          echo "  object-store: $object_store_ready"
          exit 1
      - name: Run Rust checks
        if: steps.changes.outputs.rust == 'true'
        env:
          SQLX_OFFLINE: "true"
          CARGO_INCREMENTAL: "0"
        run: devenv --secretspec-provider env --secretspec-profile development tasks run checks:rust
