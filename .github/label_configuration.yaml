---
markdown:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

rust:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"

yaml:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.yml"
          - "**/*.yaml"

postgresql:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.sql"

toml:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.toml"

nix:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.nix"

bash:
  - changed-files:
      - any-glob-to-any-file:
          - "check-views"
          - "check-private-files"
          - "tools/**"
          - "**/*.sh"
